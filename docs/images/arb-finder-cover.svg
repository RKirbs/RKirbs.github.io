<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460">
  <rect width="800" height="460" fill="#fcfcfb"/>

  <!-- Title -->
  <text x="60" y="72" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#1f2328">Arb Finder</text>
  <text x="60" y="108" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#52514e">A free sports-betting arbitrage web app · live at rkirbs.github.io</text>

  <!-- Headline numbers (from the app's source: js/books.js, js/props.js, test/) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="60" y="190" font-size="44" font-weight="700" fill="#2a78d6">18</text>
    <text x="60" y="216" font-size="18" fill="#52514e">US sportsbooks &amp; exchanges compared</text>
    <text x="60" y="282" font-size="44" font-weight="700" fill="#2a78d6">59</text>
    <text x="60" y="308" font-size="18" fill="#52514e">player-prop markets across 7 leagues</text>
    <text x="60" y="374" font-size="44" font-weight="700" fill="#eb6834">$0</text>
    <text x="60" y="400" font-size="18" fill="#52514e">to run: no server, 53 automated tests</text>
  </g>

  <!-- Illustration: one example arbitrage (sample odds, not live data) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="440" y="140" width="300" height="270" rx="14" fill="#ffffff" stroke="#e7e6e2" stroke-width="2"/>
    <rect x="460" y="160" width="92" height="40" rx="8" fill="#e6f5ee"/>
    <text x="506" y="187" font-size="19" font-weight="700" fill="#11734f" text-anchor="middle">+2.96%</text>
    <text x="566" y="178" font-size="15" font-weight="700" fill="#1f2328">Celtics @ Knicks</text>
    <text x="566" y="197" font-size="13" fill="#898781">Moneyline · example</text>

    <line x1="460" y1="218" x2="720" y2="218" stroke="#e7e6e2" stroke-width="1.5"/>
    <text x="460" y="246" font-size="15" font-weight="700" fill="#1f2328">Knicks</text>
    <text x="460" y="266" font-size="13" fill="#898781">Book A</text>
    <text x="620" y="246" font-size="15" fill="#1f2328" text-anchor="end">+110</text>
    <text x="720" y="246" font-size="15" font-weight="700" fill="#1f2328" text-anchor="end">$49</text>

    <line x1="460" y1="282" x2="720" y2="282" stroke="#e7e6e2" stroke-width="1.5"/>
    <text x="460" y="310" font-size="15" font-weight="700" fill="#1f2328">Celtics</text>
    <text x="460" y="330" font-size="13" fill="#898781">Book B</text>
    <text x="620" y="310" font-size="15" fill="#1f2328" text-anchor="end">+102</text>
    <text x="720" y="310" font-size="15" font-weight="700" fill="#1f2328" text-anchor="end">$51</text>

    <line x1="460" y1="346" x2="720" y2="346" stroke="#e7e6e2" stroke-width="1.5"/>
    <text x="460" y="378" font-size="15" fill="#52514e">Either team wins:</text>
    <text x="720" y="378" font-size="15" font-weight="700" fill="#11734f" text-anchor="end">≈ $103 back</text>
    <text x="590" y="436" font-size="15" fill="#52514e" text-anchor="middle">47.6% + 49.5% = 97.1% &lt; 100%</text>
  </g>
</svg>
