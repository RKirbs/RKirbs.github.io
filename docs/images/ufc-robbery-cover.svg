<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460">
  <rect width="800" height="460" fill="#fcfcfb"/>

  <!-- Title -->
  <text x="60" y="72" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#1f2328">The UFC Robbery Detector</text>
  <text x="60" y="108" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#52514e">Every UFC decision, 2001–2026 · the judges vs. the stats</text>

  <!-- Headline numbers (from the project's data/final outputs) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="60" y="190" font-size="44" font-weight="700" fill="#2a78d6">4,109</text>
    <text x="60" y="216" font-size="18" fill="#52514e">decisions scored</text>
    <text x="60" y="282" font-size="44" font-weight="700" fill="#2a78d6">33,444</text>
    <text x="60" y="308" font-size="18" fill="#52514e">judge round scores modelled</text>
    <text x="60" y="374" font-size="44" font-weight="700" fill="#eb6834">1 in 18</text>
    <text x="60" y="400" font-size="18" fill="#52514e">decisions a statistical "robbery"</text>
  </g>

  <!-- Mini chart: decisions by Robbery Score tier (data/final/tiers.csv) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="470" y="162" font-size="16" fill="#1f2328" font-weight="400">Clean</text>
    <text x="630" y="162" font-size="13" fill="#898781">score &lt; 0.25</text>
    <rect x="470" y="168" width="180.0" height="30" rx="3" fill="#2a78d6"/>
    <text x="658.0" y="189" font-size="15" font-weight="700" fill="#1f2328">2,841 (70.2%)</text>
    <text x="470" y="226" font-size="16" fill="#1f2328" font-weight="400">Close / defensible</text>
    <text x="630" y="226" font-size="13" fill="#898781">score 0.25–0.50</text>
    <rect x="470" y="232" width="39.2" height="30" rx="3" fill="#2a78d6"/>
    <text x="517.2" y="253" font-size="15" font-weight="700" fill="#1f2328">618 (15.3%)</text>
    <text x="470" y="290" font-size="16" fill="#1f2328" font-weight="400">Questionable</text>
    <text x="630" y="290" font-size="13" fill="#898781">score 0.50–0.75</text>
    <rect x="470" y="296" width="23.1" height="30" rx="3" fill="#2a78d6"/>
    <text x="501.1" y="317" font-size="15" font-weight="700" fill="#1f2328">365 (9.0%)</text>
    <text x="470" y="354" font-size="16" fill="#1f2328" font-weight="700">Robbery</text>
    <text x="630" y="354" font-size="13" fill="#898781">score ≥ 0.75</text>
    <rect x="470" y="360" width="14.3" height="30" rx="3" fill="#eb6834"/>
    <text x="492.3" y="381" font-size="15" font-weight="700" fill="#1f2328">225 (5.6%)</text>
    <text x="470" y="424" font-size="15" fill="#52514e">Robbery Score = 1 − P(declared winner wins)</text>
  </g>
</svg>

