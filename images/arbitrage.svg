<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460">
  <rect width="800" height="460" fill="#fcfcfb"/>
  <text x="80" y="70" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2328">Pricing gaps across sportsbooks</text>
  <!-- decorative illustration of two books' odds on the same game (not data) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="80" y="110" width="290" height="230" rx="16" fill="#ffffff" stroke="#e7e6e2" stroke-width="3"/>
    <text x="110" y="155" font-size="22" fill="#8a8984">Book A</text>
    <text x="110" y="215" font-size="30" font-weight="700" fill="#2a78d6">Team 1  +110</text>
    <text x="110" y="270" font-size="30" fill="#b9b8b2">Team 2  −130</text>
    <rect x="430" y="110" width="290" height="230" rx="16" fill="#ffffff" stroke="#e7e6e2" stroke-width="3"/>
    <text x="460" y="155" font-size="22" fill="#8a8984">Book B</text>
    <text x="460" y="215" font-size="30" fill="#b9b8b2">Team 1  −140</text>
    <text x="460" y="270" font-size="30" font-weight="700" fill="#eb6834">Team 2  +115</text>
  </g>
  <text x="80" y="410" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#52514e">How often do gaps appear, and how long do they last?</text>
</svg>
